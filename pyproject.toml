[project]
name = "research-agent"
version = "0.1.0"
description = "GeoAI / remote-sensing literature research agent: searches OpenAlex and answers with referenced, budget-limited technical answers."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.42.0",
    "opentelemetry-api>=1.45.2",
    "python-dotenv>=1.2.4",
    "typer>=0.12",
]

[project.scripts]
research-agent = "research_agent.cli:run"

[project.optional-dependencies]
ui = [
    "gradio>=6.31.0",
    "plotly>=7.1.0",
]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API requires calling Option()/Argument() as argument defaults.
"src/research_agent/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: hits the real OpenAlex API (opt-in: pytest -m live)"]
