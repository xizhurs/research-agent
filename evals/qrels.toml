# Relevance labels for retrieval metrics (eval score). Written by the project owner, never
# generated by the model or per run. One table per case ID from evals/cases.toml:
#
#   [crop-type-dl]
#   relevant = ["W1234567890"]       # works that help answer the question
#   not_relevant = ["W2345678901"]   # works a search showed that do not
#
# Precision = relevant shown / labelled shown; recall = relevant shown / all relevant. Works a run
# showed that are in neither list are counted as "unjudged" and listed in that run's report.md,
# ready to label here. A work in both lists is an error. No labels yet.
