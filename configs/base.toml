# Single source of truth for resource limits. Do not hardcode these values in code.

[limits]
max_iterations = 5
max_search_calls = 3
results_per_search = 8
abstract_max_chars = 1200
max_context_tokens = 6000
max_output_tokens = 800
max_total_tokens = 20000
max_question_chars = 2000
max_rainfall_calls = 3

# The API key is optional and is read from the OPENALEX_API_KEY environment variable, never from here.
[openalex]
base_url = "https://api.openalex.org"
timeout_seconds = 20
max_retries = 3
backoff_base_seconds = 1.0
max_backoff_seconds = 30.0
cache_dir = ".cache/openalex"
cache_ttl_days = 30

# The API key is read from the OPENAI_API_KEY environment variable, never from here.
# max_retries is handled inside the OpenAI SDK (429 / 5xx / connection errors).
[llm]
model = "gpt-6-luna"
reasoning_effort = "none"
timeout_seconds = 60
max_retries = 2

# Thresholds for code-generated limitations (see agent/limitations.py).
[reporting]
thin_evidence_works = 3
stale_after_years = 3

# Extreme-rainfall tool: Open-Meteo geocoding + archive (ERA5 reanalysis). No API key is used.
# The free tier is for non-commercial use (CC BY 4.0, attribution required); commercial use needs
# a paid Open-Meteo plan. `model` is pinned because the API's default mixes reanalysis products
# and gives different grid cells and values (verified live on 2026-11-02).
[rainfall]
geocoding_url = "https://geocoding-api.open-meteo.com/v1/search"
archive_url = "https://archive-api.open-meteo.com/v1/archive"
model = "era5"
timeout_seconds = 30
max_retries = 3
backoff_base_seconds = 1.0
max_backoff_seconds = 30.0
cache_dir = ".cache/rainfall"
cache_ttl_days = 90
earliest_year = 1940
default_start_year = 1950
baseline_start_year = 1991
baseline_end_year = 2020
min_years = 20
min_year_coverage = 0.9
top_events = 5
geocode_candidates = 10
dominance_ratio = 10.0
# Candidates this close to a larger match are merged into it before the dominance test: the
# geocoder lists a city's districts as separate places (Amsterdam: 6 districts within 10 km).
# 25 km is about one ERA5 0.25-degree grid cell, so their series would be practically the same.
same_place_km = 25.0
dry_day_mm = 1.0

# ENSO events tool: NOAA CPC Relative Oceanic Nino Index (RONI), the official ENSO index since
# Feb 2026. One plain-text file, no key. Event rule: index at or above +threshold (El Nino) or at or
# below -threshold (La Nina) for at least min_seasons consecutive overlapping 3-month seasons.
# The strength classes are a common convention, not part of the NOAA definition.
[enso]
url = "https://www.cpc.ncep.noaa.gov/data/indices/RONI.ascii.txt"
timeout_seconds = 30
max_retries = 3
backoff_base_seconds = 1.0
max_backoff_seconds = 30.0
cache_dir = ".cache/enso"
cache_ttl_days = 7
threshold = 0.5
min_seasons = 5
strength_moderate = 1.0
strength_strong = 1.5
strength_very_strong = 2.0

# Follow-up questions (`chat`, web UI Ask tab). Each turn keeps its own [limits]; this caps what
# is sent from earlier turns: task state, recent questions and answers (model-written, never
# evidence), and an ID-only index of stored works and analyses that the model can show again
# with recall_evidence. Older turns become one-line summaries written by code (no extra LLM call).
[conversation]
max_context_tokens = 2000
recent_turns = 3
answer_digest_chars = 600
max_stored_evidence = 50
max_recall_per_call = 5
max_sessions = 100
session_ttl_minutes = 120

# Evaluation (research-agent eval ...). Only `eval run --live` calls the model; it stops when the
# run would exceed max_model_calls, max_total_tokens or (if > 0) max_cost_usd, across all cases.
# Prices are USD per million tokens for the agent's model; 0 = unknown, so cost is not estimated
# and max_cost_usd cannot be used. Fill them in from your provider's price list.
[eval]
runs_dir = "evals/runs"
tool_cache_dir = "evals/tool_cache"
max_model_calls = 200
max_total_tokens = 300000
max_cost_usd = 0
price_input_per_mtok = 0
price_output_per_mtok = 0
